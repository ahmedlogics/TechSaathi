<svg width="320" height="660" viewBox="0 0 320 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Background -->
  <rect width="320" height="660" rx="36" fill="#F8FAFC" />
  
  <!-- Top Bar -->
  <rect width="320" height="28" fill="#0F172A" />
  <rect x="120" y="8" width="80" height="12" rx="6" fill="#020617" />
  
  <!-- Header -->
  <rect y="28" width="320" height="50" fill="#01411C" />
  <text x="160" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="system-ui, sans-serif">Application Review (درخواست کا جائزہ)</text>
  
  <!-- Training Badge -->
  <rect x="20" y="90" width="280" height="26" rx="8" fill="#FEF3C7" stroke="#FDE68A" />
  <text x="160" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E" font-family="system-ui, sans-serif">Educational Training Screen (تعلیمی مشق)</text>
  
  <!-- Summary Card -->
  <rect x="20" y="128" width="280" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Row 1: Service -->
  <text x="36" y="158" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Service (خدمت):</text>
  <text x="36" y="176" font-size="13" font-weight="bold" fill="#01411C" font-family="system-ui, sans-serif">Proof of Life (سرٹیفیکیٹ برائے حیات)</text>
  <line x1="36" y1="190" x2="284" y2="190" stroke="#F1F5F9" />
  
  <!-- Row 2: Applicant -->
  <text x="36" y="212" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Applicant (درخواست گزار):</text>
  <text x="36" y="230" font-size="13" font-weight="bold" fill="#0F172A" font-family="system-ui, sans-serif">Aamir Nazir (Myself - میں خود)</text>
  <line x1="36" y1="244" x2="284" y2="244" stroke="#F1F5F9" />
  
  <!-- Row 3: Priority -->
  <text x="36" y="266" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Priority (پروسیسنگ ترجیح):</text>
  <text x="36" y="284" font-size="13" font-weight="bold" fill="#0F172A" font-family="system-ui, sans-serif">Executive Fast-Track</text>
  <line x1="36" y1="298" x2="284" y2="298" stroke="#F1F5F9" />
  
  <!-- Row 4: Fee -->
  <text x="36" y="320" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Total Payable Fee (فیس):</text>
  <text x="36" y="338" font-size="15" font-weight="bold" fill="#059669" font-family="system-ui, sans-serif">PKR 0 (Free Service - مفت)</text>
  <line x1="36" y1="352" x2="284" y2="352" stroke="#F1F5F9" />
  
  <!-- Row 5: Facial Status -->
  <text x="36" y="374" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Facial Liveliness Check:</text>
  <text x="36" y="392" font-size="12" font-weight="bold" fill="#059669" font-family="system-ui, sans-serif">&#10004; Verified &amp; Completed (مکمل)</text>
  <line x1="36" y1="406" x2="284" y2="406" stroke="#F1F5F9" />
  
  <!-- Row 6: Fingerprints Status -->
  <text x="36" y="428" font-size="11" fill="#64748B" font-family="system-ui, sans-serif">Fingerprints Verification:</text>
  <text x="36" y="446" font-size="12" font-weight="bold" fill="#059669" font-family="system-ui, sans-serif">&#10004; Captured &amp; Verified (مکمل)</text>

  <!-- Safe Simulation Note -->
  <rect x="20" y="482" width="280" height="48" rx="12" fill="#ECFDF5" stroke="#A7F3D0" />
  <text x="160" y="504" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065F46" font-family="system-ui, sans-serif">Practice Mode: Safe Simulation</text>
  <text x="160" y="519" text-anchor="middle" font-size="9" fill="#047857" font-family="system-ui, sans-serif">No real data is transmitted to NADRA servers.</text>

  <!-- Submit Button (Target) -->
  <rect x="20" y="550" width="280" height="54" rx="16" fill="#01411C" />
  <text x="160" y="575" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="system-ui, sans-serif">Submit Practice Application</text>
  <text x="160" y="593" text-anchor="middle" font-size="10.5" fill="#A7F3D0" font-family="system-ui, sans-serif">(مشق درخواست جمع کروائیں)</text>
</svg>

